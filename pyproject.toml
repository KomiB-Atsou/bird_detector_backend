[tool.poetry]
name = "bird-detector-backend"
version = "0.1.0"
description = "Backend for bird detector project"
authors = ["Komi Atsou <you@example.com>"]
readme = "README.md"
packages = [{ include = "bird_detector_backend" }]

[tool.poetry.dependencies]
python = ">=3.7,<3.8"
tensorflow = "1.14"
absl-py = "0.8.1"
numpy = "^1.18"
scipy = "^1.4"
opencv-python = "^4.2"
Pillow = "^6.2"
flask = "^1.1"
markupsafe = "2.0.1"

[tool.poetry.dev-dependencies]
pytest = "^5.4"
black = "^20.8b1"
flake8 = "^3.8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
